<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="A production-quality, minimal premium calculator web application built with modern vanilla JavaScript, HTML5, and CSS3." />
  <meta name="theme-color" content="#0d0f12" id="meta-theme-color" />
  <title>Aura Calculator · Premium Web Calculator</title>

  <!-- Preconnect to Google Fonts for Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background Glow & Mesh -->
  <div class="bg-mesh" aria-hidden="true"></div>

  <main class="app-container">
    <!-- Calculator Card -->
    <div class="calculator-wrapper">
      <section class="calculator" id="calculator" role="region" aria-label="Calculator">
        
        <!-- Header Controls (Theme, Sound, History) -->
        <header class="calculator-header">
          <div class="brand-badge">
            <span class="brand-dot"></span>
            <span class="brand-title">AURA <span class="brand-sub">PRO</span></span>
          </div>

          <div class="header-actions">
            <!-- Audio Feedback Toggle -->
            <button type="button" class="icon-btn" id="btn-sound" aria-label="Toggle sound effects" title="Toggle audio feedback (Key: S)">
              <svg class="icon icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
              <svg class="icon icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
            </button>

            <!-- Theme Toggle -->
            <button type="button" class="icon-btn" id="btn-theme" aria-label="Toggle color theme" title="Toggle dark / light theme (Key: T)">
              <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>

            <!-- History Toggle -->
            <button type="button" class="icon-btn" id="btn-history" aria-label="Toggle calculation history" title="Calculation history (Key: H)">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span class="history-badge" id="history-badge" aria-hidden="true" style="display: none;">0</span>
            </button>
          </div>
        </header>

        <!-- Display Screen -->
        <div class="display-container" id="display-container" role="region" aria-label="Calculator display">
          <!-- Copy Toast Notification -->
          <div class="toast-notification" id="toast-notification" role="status" aria-live="polite">Copied to clipboard</div>

          <!-- Quick Copy Action Button -->
          <button type="button" class="btn-copy-display" id="btn-copy" aria-label="Copy result to clipboard" title="Copy current value (Key: C)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>

          <!-- Upper Expression (e.g. "1,240 × 5 +") -->
          <div class="display-expression" id="display-expression" aria-live="polite" aria-label="Previous expression"></div>

          <!-- Main Input / Result Display -->
          <div class="display-main-wrapper">
            <div class="display-main" id="display-main" aria-live="assertive" aria-label="Current value">0</div>
          </div>
        </div>

        <!-- Keypad Grid (5 rows x 4 cols) -->
        <div class="keypad-grid" role="group" aria-label="Calculator keypad">
          <!-- Row 1: AC/C, Negate, Percent, Divide -->
          <button type="button" class="calc-btn btn-function" id="btn-clear" data-action="clear" aria-label="Clear all">AC</button>
          <button type="button" class="calc-btn btn-function" data-action="negate" aria-label="Change sign positive or negative">±</button>
          <button type="button" class="calc-btn btn-function" data-action="percent" aria-label="Percent">%</button>
          <button type="button" class="calc-btn btn-operator" data-action="operator" data-operator="/" aria-label="Divide">÷</button>

          <!-- Row 2: 7, 8, 9, Multiply -->
          <button type="button" class="calc-btn btn-number" data-action="number" data-value="7" aria-label="7">7</button>
          <button type="button" class="calc-btn btn-number" data-action="number" data-value="8" aria-label="8">8</button>
          <button type="button" class="calc-btn btn-number" data-action="number" data-value="9" aria-label="9">9</button>
          <button type="button" class="calc-btn btn-operator" data-action="operator" data-operator="*" aria-label="Multiply">×</button>

          <!-- Row 3: 4, 5, 6, Subtract -->
          <button type="button" class="calc-btn btn-number" data-action="number" data-value="4" aria-label="4">4</button>
          <button type="button" class="calc-btn btn-number" data-action="number" data-value="5" aria-label="5">5</button>
          <button type="button" class="calc-btn btn-number" data-action="number" data-value="6" aria-label="6">6</button>
          <button type="button" class="calc-btn btn-operator" data-action="operator" data-operator="-" aria-label="Subtract">−</button>

          <!-- Row 4: 1, 2, 3, Add -->
          <button type="button" class="calc-btn btn-number" data-action="number" data-value="1" aria-label="1">1</button>
          <button type="button" class="calc-btn btn-number" data-action="number" data-value="2" aria-label="2">2</button>
          <button type="button" class="calc-btn btn-number" data-action="number" data-value="3" aria-label="3">3</button>
          <button type="button" class="calc-btn btn-operator" data-action="operator" data-operator="+" aria-label="Add">+</button>

          <!-- Row 5: 0, Decimal, Backspace, Equals -->
          <button type="button" class="calc-btn btn-number" data-action="number" data-value="0" aria-label="0">0</button>
          <button type="button" class="calc-btn btn-number" data-action="decimal" aria-label="Decimal point">.</button>
          <button type="button" class="calc-btn btn-function btn-backspace" data-action="backspace" aria-label="Backspace" title="Backspace">
            <svg class="icon-backspace" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
          <button type="button" class="calc-btn btn-equals" data-action="equals" aria-label="Equals">=</button>
        </div>

        <!-- History Slide-over Drawer -->
        <aside class="history-panel" id="history-panel" aria-label="Calculation history drawer" aria-hidden="true">
          <div class="history-header">
            <div class="history-title-group">
              <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <h2 class="history-title">History</h2>
            </div>
            <div class="history-actions">
              <button type="button" class="btn-text-action" id="btn-clear-history" aria-label="Clear all history">Clear</button>
              <button type="button" class="icon-btn icon-btn-sm" id="btn-close-history" aria-label="Close history">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="history-list" id="history-list" role="list">
            <!-- Dynamic history entries will be injected here -->
          </div>

          <div class="history-empty" id="history-empty">
            <svg class="icon-empty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
              <line x1="9" y1="9" x2="15" y2="9"></line>
              <line x1="9" y1="13" x2="15" y2="13"></line>
              <line x1="9" y1="17" x2="11" y2="17"></line>
            </svg>
            <p>No calculations yet</p>
            <span>Completed calculations appear here</span>
          </div>
        </aside>

      </section>

      <!-- Keyboard Shortcuts Tooltip / Footer Bar -->
      <footer class="app-footer">
        <div class="shortcuts-legend">
          <span class="shortcut-item"><kbd>0</kbd>–<kbd>9</kbd> Digits</span>
          <span class="shortcut-item"><kbd>+</kbd> <kbd>−</kbd> <kbd>*</kbd> <kbd>/</kbd> Ops</span>
          <span class="shortcut-item"><kbd>Enter</kbd> =</span>
          <span class="shortcut-item"><kbd>Esc</kbd> Clear</span>
          <span class="shortcut-item"><kbd>⌫</kbd> Del</span>
        </div>
      </footer>
    </div>
  </main>

  <!-- Application Logic -->
  <script src="script.js"></script>
</body>
</html>
